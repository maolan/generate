[package]
name = "maolan-generate"
default-run = "maolan-generate"
description = "Generate music using Maolan and HeartMuLa"
version = "0.0.13"
edition = "2024"
license = "BSD-2-Clause"
readme = "README.md"
publish = true
build = "build.rs"
repository = "https://github.com/maolan/generate"
homepage = "https://maolan.github.io"
keywords = ["audio", "ai", "generate"]
categories = ["multimedia::audio"]

[features]
default = []

[dependencies]
anyhow = "1.0.104"
burn = { version = "0.21.0", default-features = false, features = ["std", "ndarray", "wgpu"] }
burn-ndarray = { version = "0.21.0", default-features = false, features = ["multi-threads", "std"] }
burn-store = { version = "0.21.0", default-features = false, features = ["burnpack", "std", "memmap"] }
half = "2.7.1"
huggingface-hub = { package = "hf-hub", version = "0.5.0", default-features = false, features = ["ureq"] }
maolan-llama = { version = "0.0.1", default-features = false, features = ["llama3", "import"] }
oxideav-basic = "0.0.9"
oxideav-core = "0.1.34"
symphonia = { version = "0.5.4", features = ["wav"] }
midly = "0.5.3"
rand = { version = "0.10.2", features = ["std_rng"] }
rayon = "1.12.0"
safetensors = "0.8.0"
sentencepiece-rust = "0.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokenizers = "0.23.1"
tokie = "0.0.10"

[build-dependencies]
anyhow = "1.0.104"
