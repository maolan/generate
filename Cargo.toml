[package]
name = "maolan-generate"
version = "0.0.18"
default-run = "maolan-generate"
description = "Generate music using Maolan and AI"
edition = "2024"
license = "BSD-2-Clause"
readme = "README.md"
publish = true
build = "build.rs"
repository = "https://github.com/maolan/generate"
homepage = "https://maolan.rs"
keywords = ["audio", "ai", "generate"]
categories = ["multimedia::audio"]

[features]
default = []

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
burn = { version = "0.22.0", default-features = false, features = ["std", "flex", "wgpu"] }
burn-store = { version = "0.22.0", default-features = false, features = ["std", "memmap"] }
half = "2.7.1"
huggingface-hub = { package = "hf-hub", version = "1.0", default-features = false, features = ["blocking"] }
maolan-llama = { version = "0.0.3", default-features = false, features = ["llama3", "import"] }
oxideav-basic = "0.0.11"
oxideav-core = "0.1.39"
symphonia = { version = "0.6.1", features = ["wav"] }
midly = "0.5.3"
rand = { version = "0.10.3", features = ["std_rng"] }
rayon = "1.12.0"
safetensors = "0.8.0"
sentencepiece-rust = "0.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokie = "0.1.4"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
anyhow = "1.0.104"
