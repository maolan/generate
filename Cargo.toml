[package]
name = "maolan-generate"
version = "0.0.22"
default-run = "maolan-generate"
description = "Generate music using Maolan and AI"
edition = "2024"
license = "BSD-2-Clause"
readme = "README.md"
publish = true
build = "build.rs"
repository = "https://github.com/maolan/generate"
homepage = "https://maolan.rs"
keywords = ["audio", "ai", "generate"]
categories = ["multimedia::audio"]

[features]
default = []

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
burn = { version = "0.22.1", default-features = false, features = ["std", "flex", "wgpu"] }
burn-store = { version = "0.22.1", default-features = false, features = ["std", "memmap"] }
half = "2.7.1"
huggingface-hub = { package = "hf-hub", version = "1.0", default-features = false, features = ["blocking"] }
maolan-llama = { version = "0.0.4", default-features = false, features = ["llama3", "import"] }
oxideav-basic = "0.0.12"
oxideav-core = "0.1.43"
midly = "0.5.3"
rand = { version = "0.10.4", features = ["std_rng"] }
rayon = "1.12.0"
safetensors = "0.8.0"
sentencepiece-rust = "0.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokie = "0.2.0"

[dev-dependencies]
symphonia = { version = "0.6.1", features = ["wav"] }
tempfile = "3"

[build-dependencies]
anyhow = "1.0.104"

[package.metadata.deb]
name = "maolan-generate"
maintainer = "Maolan Team <studio@maolan.rs>"
section = "sound"
priority = "optional"
copyright = "2026, Maolan Team <studio@maolan.rs>"
depends = "libvulkan1"
assets = [
  ["target/release/maolan-generate", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/maolan-generate/", "644"],
  ["LICENSE", "usr/share/doc/maolan-generate/", "644"],
  ["man/maolan-generate.1", "usr/share/man/man1/", "644"],
]

[package.metadata.generate-rpm]
name = "maolan-generate"
summary = "Maolan AI Music Generation CLI"
license = "BSD-2-Clause"
url = "https://github.com/maolan/generate"
assets = [
  { source = "target/release/maolan-generate", dest = "/usr/bin/maolan-generate", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/maolan-generate/README.md", mode = "644" },
  { source = "LICENSE", dest = "/usr/share/doc/maolan-generate/LICENSE", mode = "644" },
  { source = "man/maolan-generate.1", dest = "/usr/share/man/man1/maolan-generate.1", mode = "644" },
]

[package.metadata.generate-rpm.requires]
vulkan-loader = "*"
