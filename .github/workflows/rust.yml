name: Rust

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:
    inputs:
      release_build:
        description: "Build release assets instead of running lint and tests"
        type: boolean
        default: false
      release_tag:
        description: "Release tag to name and publish assets under"
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write

jobs:
  lint-and-test:
    if: ${{ !inputs.release_build }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

  build-release:
    if: ${{ inputs.release_build }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          asset="maolan-generate-${{ inputs.release_tag }}-${{ matrix.suffix }}"
          mkdir -p "dist/$asset"
          cp "target/${{ matrix.target }}/release/maolan-generate" "dist/$asset/"
          cp LICENSE README.md "dist/$asset/"
          tar -C dist -czf "dist/$asset.tar.gz" "$asset"

      - name: Package release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "maolan-generate-${{ inputs.release_tag }}-${{ matrix.suffix }}"
          New-Item -ItemType Directory -Force "dist/$asset" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/maolan-generate.exe" "dist/$asset/"
          Copy-Item LICENSE, README.md "dist/$asset/"
          Compress-Archive -Path "dist/$asset" -DestinationPath "dist/$asset.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: maolan-generate-${{ inputs.release_tag }}-${{ matrix.suffix }}
          path: dist/*.*

  publish-release-assets:
    if: ${{ inputs.release_build }}
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Publish assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mapfile -t artifacts < <(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No release artifacts found in dist/"
            find dist -maxdepth 3 -print
            exit 1
          fi
          gh release upload "$TAG_NAME" "${artifacts[@]}" --clobber --repo "$REPOSITORY"
